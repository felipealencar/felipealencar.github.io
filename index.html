<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Redirecting…</title>
		<meta http-equiv="refresh" content="5; url=https://felipealencar.net" />
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
				padding: 24px;
			}
			main {
				max-width: 640px;
				text-align: center;
			}
			p {
				line-height: 1.6;
			}
			a {
				word-break: break-word;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Redirecting to felipealencar.net</h1>
			<p>
				You will be redirected in <strong><span id="countdown">5</span> seconds</strong>.
			</p>
			<p>
				If it doesn’t happen automatically, use this link:
				<a href="https://felipealencar.net">https://felipealencar.net</a>
			</p>
		</main>
		<script>
			(function () {
				var seconds = 5;
				var countdownEl = document.getElementById('countdown');
				var timer = window.setInterval(function () {
					seconds -= 1;
					if (countdownEl && seconds >= 0) {
						countdownEl.textContent = String(seconds);
					}
					if (seconds <= 0) {
						window.clearInterval(timer);
						window.location.href = 'https://felipealencar.net';
					}
				}, 1000);
			})();
		</script>
	</body>
</html>
